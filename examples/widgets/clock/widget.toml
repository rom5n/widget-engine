#:schema ../../../schemas/widget.schema.json
id = "dev.widget-engine.clock"
name = "Clock"
variant = "Wide"
category = "Time"
engine = "^0.1"
size = [352, 170]

[card]
radius = 26
background = "frosted"

[font]
family = "Nunito"
weight = 600

[customize]
allow = ["size", "background", "theme", "font"]

[[option]]
key = "dial"
label = "Dial"
sizes = { off = [170, 170] }

[[option]]
key = "hands"
label = "Hour and minute hands"

[[option]]
key = "second"
label = "Second hand"

[[option]]
key = "date"
label = "Date"

