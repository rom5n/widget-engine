[workspace]
resolver = "3"
members = ["crates/engine", "crates/engine-ffi"]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The windows crate is huge; optimizing it alone at opt-level 3 in one codegen unit needs several
# GB of memory. Fat LTO optimizes it again at link time, so this costs nothing in the output.
[profile.release.package.windows]
opt-level = 1
codegen-units = 16
